name: Keep Render Services Alive

on:
  schedule:
    - cron: '*/15 * * * *' 

  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping MusIQ
        run: curl -I https://musiq-sc2d.onrender.com || true
